services:
  - type: web
    name: spec2assert-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://spec2assert.vercel.app,http://localhost:3000
      - key: MODEL_NAME
        value: meta-llama/llama-3.3-70b-instruct
